<main id="online-degrees-page">

      <a class="brand" href="../" aria-label="ManzilChaser home"><img src="../dashboard/hero/assets/brand-logo.svg" alt="" /></a>

        <button class="site-nav__item" type="button" data-menu="Explore" aria-controls="mega-menu" aria-expanded="false">Explore <img src="../dashboard/hero/assets/chevron.svg" alt="" /></button>
        <button class="site-nav__item" type="button" data-route="kids-learning">Kids Learning</button>
        <button class="site-nav__item" type="button" data-menu="Exams" aria-controls="mega-menu" aria-expanded="false">Exams <img src="../dashboard/hero/assets/chevron.svg" alt="" /></button>

        <div class="mega-menu__column" data-column="Learning"><h2>Learning</h2><button type="button" data-path="kids-learning"><img src="../dashboard/hero/assets/menu-kids.svg" alt="" />Kids Learning</button><button type="button" data-path="tuitions"><img src="../dashboard/hero/assets/menu-tuitions.svg" alt="" />Tuitions</button><button type="button" data-path="coding-it"><img src="../dashboard/hero/assets/menu-coding.svg" alt="" />Coding &amp; IT</button><button type="button" data-path="language-learning"><img src="../dashboard/hero/assets/menu-language.svg" alt="" />Language Learning</button></div>

      </div>
    </header>
    <div class="od-hero__content">
      <div class="od-hero__copy">
        <p class="od-hero__eyebrow">ONLINE DEGREES</p>
        <h1 id="od-hero-title">Find Your Right <span class="orange-sticker">degree.</span><em>Build your future.</em></h1>
        <p class="od-hero__intro">Explore, compare, and choose the right online degree for your goals.</p>
        <form class="od-hero__search" id="degree-hero-search"><img src="./hero/assets/f6c77.svg" alt="" /><input name="query" type="search" placeholder="Search degrees, universities or specializations..." aria-label="Search online degrees" /><button type="submit">Search <span><img src="./hero/assets/53e79.svg" alt="" /></span></button></form>
        <div class="od-hero__popular"><h2>Popular searches</h2><div><button type="button" data-degree-topic="MBA"><img src="./hero/assets/5de13.svg" alt="" />MBA</button><button type="button" data-degree-topic="MCA"><img src="./hero/assets/39a01.svg" alt="" />MCA</button><button type="button" data-degree-topic="BBA"><img src="./hero/assets/8cc7d.svg" alt="" />BBA</button><button type="button" data-degree-topic="BCA"><img src="./hero/assets/89f64.svg" alt="" />BCA</button><button type="button" data-degree-topic="M.Com"><img src="./hero/assets/ebcf1.svg" alt="" />M.Com</button></div></div>
        <div class="od-hero__actions"><a class="od-hero__action od-hero__action--primary" href="#need-guidance"><span><img src="./hero/assets/177fb.svg" alt="" /></span>Book 1 on 1 slot</a><a class="od-hero__action od-hero__action--secondary" href="#online-programs">Explore Options <span><img src="../dashboard/hero/assets/nav-arrow.svg" alt="" /></span></a></div>
      </div>
      <div class="od-hero__visual">
        <img class="od-hero__blob" src="./hero/assets/2b3ec.svg" alt="" />
        <div class="od-hero__student-frame"><img class="od-hero__student" src="./hero/assets/039c9.png" alt="Student learning through an online degree program" /></div>
      </div>
