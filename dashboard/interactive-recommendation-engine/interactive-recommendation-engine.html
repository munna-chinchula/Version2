<section class="landing-section recommendation-engine" id="interactive-recommendation-engine" aria-labelledby="recommendation-title">
  <div class="section-head section-head--center">
    <p class="section-kicker">INTERACTIVE RECOMMENDATION ENGINE</p>
    <h2 class="section-title" id="recommendation-title">Find what’s <span class="orange-sticker">right</span> for you.</h2>
  </div>
  <form id="recommendation-form" class="recommendation-engine__form">
    <div class="recommendation-engine__fields">
      <label>Choose your goal<span class="recommendation-engine__select"><select name="goal" required><option value="" selected disabled>Course / Career / Exam / Study Abroad</option><option value="course">Course</option><option value="career">Career</option><option value="exam">Exam</option><option value="study-abroad">Study Abroad</option></select><img src="./dashboard/interactive-recommendation-engine/assets/ccf60.svg" alt="" /></span></label>
      <label>Tell us about yourself<span class="recommendation-engine__select"><select name="profile" required><option value="" selected disabled>Education / Score / Interests / Location</option><option value="school">School student</option><option value="college">College student</option><option value="graduate">Graduate</option><option value="parent">Parent</option></select><img src="./dashboard/interactive-recommendation-engine/assets/ccf60.svg" alt="" /></span></label>
      <label>Explore your matches<span class="recommendation-engine__select"><select name="match" required><option value="" selected disabled>Programs / Colleges / Courses / Opportunities</option><option value="programs">Programs</option><option value="colleges">Colleges</option><option value="courses">Courses</option><option value="opportunities">Opportunities</option></select><img src="./dashboard/interactive-recommendation-engine/assets/ccf60.svg" alt="" /></span></label>
    </div>
    <div class="recommendation-engine__action"><button class="cta-button" type="submit">FIND YOUR PATH <span class="cta-button__icon"><img src="./dashboard/interactive-recommendation-engine/assets/0abb2.svg" alt="" /></span></button><img class="recommendation-engine__accent" src="./dashboard/interactive-recommendation-engine/assets/fdd40.svg" alt="" /></div>
  </form>
</section>
